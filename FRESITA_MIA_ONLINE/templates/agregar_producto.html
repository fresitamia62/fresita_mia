<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Agregar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">

</head>

<body class="detalle-body">

<div class="detalle-contenedor">

    <h1>🍓 Agregar Producto</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Nombre</label>

        <input
            type="text"
            name="nombre"
            required
        >

        <br><br>

        <label>Descripción</label>

        <textarea
            name="descripcion"
            rows="3"
            required
        ></textarea>

        <br><br>

        <label>Precio</label>

        <input
            type="number"
            step="0.01"
            name="precio"
            required
        >

        <br><br>

        <label>Categoría</label>

        <select name="categoria" required>

            <option>Fresas con crema</option>
            <option>Rebanafresa</option>
            <option>Mini Hotcakes</option>
            <option>Fresas Combinadas</option>
            <option>Mega Antojo</option>
            <option>Antojos</option>
            <option>Pasteles</option>

        </select>

        <br><br>

        <label>Estado</label>

        <select name="estado">

            <option value="disponible">
                Disponible
            </option>

            <option value="agotado">
                Agotado
            </option>

        </select>

        <br><br>

        <label>Imagen</label>

        <input
            type="file"
            name="imagen"
            accept="image/*"
            required
        >

        <br><br>

        <hr>

        <h3>Opciones de personalización</h3>

        <label>

            <input
                type="checkbox"
                name="permite_tamano"
            >

            Permite tamaño

        </label>

        <br><br>

        <label>Tipo de personalización</label>

        <select name="tipo_personalizacion">

            <option value="ninguna">
                Ninguna
            </option>

            <option value="normal">
                Normal
            </option>

            <option value="rebanafresa">
                Rebanafresa
            </option>

            <option value="especial">
                Especial
            </option>

        </select>

        <br><br>

        <label>Toppings incluidos</label>

        <input
            type="number"
            name="toppings_incluidos"
            value="0"
        >

        <br><br>

        <label>Jarabes incluidos</label>

        <input
            type="number"
            name="jarabes_incluidos"
            value="0"
        >

        <br><br>

        <label>

            <input
                type="checkbox"
                name="permite_pastel"
            >

            Permite pastel

        </label>

        <br><br>

        <label>

            <input
                type="checkbox"
                name="permite_frutas"
            >

            Permite frutas

        </label>

        <br><br>

        <button
            type="submit"
            class="editar-btn"
        >

            ➕ Guardar Producto

        </button>

        <a
            href="{{ url_for('admin_productos') }}"
            class="btn-regresar"
        >

            Cancelar

        </a>

    </form>

</div>

</body>

</html>
